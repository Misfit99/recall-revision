<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cram Jam — Revision Library</title>
  <meta name="description" content="Cram hard. Jam harder. Interview revision cards: Core Java and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(-8 16 16)'%3E%3Crect x='3' y='6' width='26' height='20' rx='6' fill='%23ff8a5b' stroke='%2312141a' stroke-width='2'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial,sans-serif' font-weight='900' font-size='12' fill='%2312141a'%3ECJ%3C/text%3E%3C/g%3E%3C/svg%3E" />
  <script>
    try { var t = localStorage.getItem("recall.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="progress-line" id="progressLine"></div>

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark">CJ</span>
      <span class="brand-name">Cram <em>Jam</em></span>
    </a>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="topbar-actions">
      <button class="search-trigger" id="searchOpen" aria-label="Search">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="search-label">Search</span>
        <kbd>⌘K</kbd>
      </button>
      <a class="icon-btn" href="#/review" title="Review queue" aria-label="Review queue">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="badge" id="reviewBadge" hidden></span>
      </a>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-panel" role="dialog" aria-label="Search">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Search cards, traps, code…  e.g. volatile, PECS, finally" autocomplete="off" spellcheck="false" />
        <kbd>esc</kbd>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <script src="content/registry.js"></script>
  <script src="content/subjects.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
